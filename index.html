<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/ui/game-logo.png" />
    <link rel="apple-touch-icon" href="/assets/ui/game-logo.png" />
    <!-- The game is a fixed-size stage that scales itself to fit, so pinch-zoom
         would only fight that. viewport-fit=cover lets it fill notched screens. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Virtual Cooking Laboratory</title>
    <!-- Display + body faces. The system font stack read as generic UI rather
         than as a game; Lilita One carries the signage/title voice and Nunito
         keeps long instruction text readable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
